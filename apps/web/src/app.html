<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <script>
      // restore saved theme before first paint to avoid a light flash
      (function () {
        try {
          var t = localStorage.getItem('ego-ipse-theme');
          document.documentElement.setAttribute(
            'data-theme',
            t === 'light' || t === 'dark' ? t : 'light'
          );
        } catch (e) {
          document.documentElement.setAttribute('data-theme', 'light');
        }
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preconnect" href="https://cdn.sanity.io" crossorigin />
    <link
      rel="preload"
      as="style"
      href="https://fonts.googleapis.com/css2?family=Geist:ital,wght@0,200;0,300;0,400;0,500;1,400&family=Geist+Mono:wght@400;500;600&family=Geist+Pixel&display=swap"
    />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Geist:ital,wght@0,200;0,300;0,400;0,500;1,400&family=Geist+Mono:wght@400;500;600&family=Geist+Pixel&display=swap"
      media="print"
      onload="this.media = 'all'"
    />
    <noscript>
      <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Geist:ital,wght@0,200;0,300;0,400;0,500;1,400&family=Geist+Mono:wght@400;500;600&family=Geist+Pixel&display=swap"
      />
    </noscript>
    %sveltekit.head%
  </head>
  <body data-sveltekit-preload-data="hover">
    <div style="display: contents">%sveltekit.body%</div>
  </body>
</html>
